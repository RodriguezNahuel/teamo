<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una rosa para vos</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌹</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --dim: #78787f;
    --text: #c8c8d2;
    --red: #ff4659;
    --paper: #faf1e4;
    --ink: #46202a;
    --mono: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { color: var(--text); font-family: var(--mono); -webkit-tap-highlight-color: transparent; }

  canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; }
  #glow { opacity: .95; mix-blend-mode: screen; pointer-events: none; }

  .hud { position: fixed; font-size: 12px; line-height: 1.45; color: var(--dim); pointer-events: none; white-space: pre; }
  #hud-t { top: max(8px, env(safe-area-inset-top)); right: 14px; }
  #hud-t b { color: var(--red); font-weight: normal; }
  #hud-info { left: 14px; bottom: calc(30px + env(safe-area-inset-bottom)); }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 6px 12px calc(6px + env(safe-area-inset-bottom));
         display: flex; justify-content: space-between; font-size: 12px; color: var(--dim);
         border-top: 1px solid #1c1c22; background: #000; }
  #bar span:first-child { color: var(--text); }

  /* pantalla de carga */
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 5;
          background: #000; transition: opacity .8s ease; }
  #boot pre { margin: 0; font-size: 13px; color: var(--text); min-width: 240px; }
  #boot .cur { display: inline-block; width: .6em; height: 1.1em; background: var(--red); vertical-align: -0.2em;
               animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* sobre */
  #env { position: fixed; right: 14px; bottom: calc(40px + env(safe-area-inset-bottom)); z-index: 3;
         background: none; border: 0; padding: 8px; cursor: pointer; font-family: var(--mono);
         color: #fae1cd; opacity: 0; transform: translateY(10px); pointer-events: none;
         transition: opacity 1.2s ease, transform 1.2s ease; }
  #env.show { opacity: 1; transform: none; pointer-events: auto; animation: float 3s ease-in-out 1.2s infinite; }
  #env pre { margin: 0; font-size: 13px; line-height: 1.15; text-shadow: 0 0 8px rgba(255, 190, 170, .55); }
  #env pre i { font-style: normal; color: var(--red); text-shadow: 0 0 10px var(--red); }
  #env small { display: block; margin-top: 4px; font-size: 11px; color: #ff8a9c; text-align: center;
               letter-spacing: .04em; animation: pulse 2s ease-in-out infinite; }
  #env:hover pre, #env:focus-visible pre { color: #fff; }
  #env:focus-visible { outline: 1px dashed #ff8a9c; outline-offset: 2px; }
  @keyframes float { 50% { transform: translateY(-5px); } }
  @keyframes pulse { 50% { opacity: .45; } }

  /* carta */
  #letter { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 18px;
            background: rgba(0, 0, 0, .55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
            opacity: 0; pointer-events: none; transition: opacity .45s ease; }
  #letter.open { opacity: 1; pointer-events: auto; }
  .paper { --lh: 34px; position: relative; width: min(560px, 100%); max-height: min(82dvh, 760px); overflow: auto;
           padding: 38px 34px 30px; border-radius: 6px; color: var(--ink);
           background:
             repeating-linear-gradient(to bottom, transparent 0 calc(var(--lh) - 1px), rgba(180, 120, 120, .18) calc(var(--lh) - 1px) var(--lh)) 0 92px / 100% calc(100% - 120px) no-repeat,
             radial-gradient(120% 90% at 50% 0%, #fffaf2 0%, var(--paper) 60%, #f1e2cc 100%);
           box-shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 30px 80px rgba(255, 40, 70, .18), 0 10px 30px rgba(0, 0, 0, .6);
           transform: perspective(900px) rotateX(18deg) translateY(40px) scale(.92); transform-origin: 50% 100%;
           transition: transform .7s cubic-bezier(.2, .9, .25, 1.05); }
  #letter.open .paper { transform: none; }
  .paper::before { content: "♥"; position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
                   color: #d83a55; font-size: 16px; }
  .paper .to { font-family: "Caveat", cursive; font-size: 30px; margin: 4px 0 10px; min-height: 1em; }
  .paper .body { font-family: "Cormorant Garamond", Georgia, serif; font-size: 21px; line-height: var(--lh);
                 white-space: pre-wrap; min-height: 272px; margin: 0; }
  .paper .from { font-family: "Caveat", cursive; font-size: 28px; text-align: right; margin: 18px 0 0; min-height: 1em; }
  .close { position: absolute; top: 8px; right: 10px; width: 34px; height: 34px; border: 0; border-radius: 50%;
           background: transparent; color: #9a6a72; font-size: 22px; cursor: pointer; }
  .close:hover { background: rgba(200, 80, 100, .1); color: var(--ink); }
  .hint { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
          font-size: 11px; color: #8a8a94; pointer-events: none; }

  #err { position: fixed; inset: auto 12px 50px; color: #ff8a9c; font-size: 12px; white-space: pre-wrap; z-index: 6; }

  @media (max-width: 480px) {
    .paper { --lh: 27px; padding: 30px 22px 20px; max-height: 88dvh; }
    .paper .to { font-size: 26px; margin: 2px 0 6px; }
    .paper .body { font-size: 17.5px; min-height: 0; }
    .paper .from { font-size: 25px; margin-top: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #env.show, #env small { animation: none; }
    .paper { transition: none; }
  }
</style>
</head>
<body>
<canvas id="main" aria-label="Una rosa hecha de letras que crece y florece"></canvas>
<canvas id="glow" aria-hidden="true"></canvas>

<div class="hud" id="hud-t"><b>●</b> t   0.00s</div>
<div class="hud" id="hud-info"></div>
<div id="bar"><span>$ py teamo.py</span><span id="fps">starting…</span></div>

<button id="env" aria-label="Abrir la carta">
<pre> _________
|\       /|
| \  <i>♥</i>  / |
|  `---'  |
|_________|</pre><small>tocá la carta</small>
</button>

<div id="letter" role="dialog" aria-modal="true" aria-label="Carta">
  <article class="paper">
    <button class="close" aria-label="Cerrar">×</button>
    <p class="to" id="l-to"></p>
    <p class="body" id="l-body"></p>
    <p class="from" id="l-from"></p>
  </article>
  <div class="hint">tocá afuera para cerrar</div>
</div>

<div id="boot"><pre id="boot-log"></pre></div>
<div id="err"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const log = $("boot-log");
  const lines = [];
  const say = (s) => { lines.push(s); log.innerHTML = lines.join("\n") + ' <span class="cur"></span>'; };
  say("$ py teamo.py");

  // todo el calculo de Python corre en worker.js (otro hilo)
  const worker = new Worker("worker.js");

  const main = $("main"), glow = $("glow");
  const ctx = main.getContext("2d", { alpha: false });
  const gctx = glow.getContext("2d");
  const tiny = document.createElement("canvas");
  const tctx = tiny.getContext("2d");
  const FONT = getComputedStyle(document.body).getPropertyValue("--mono");
  const mobile = matchMedia("(pointer: coarse)").matches || innerWidth < 700;
  let C, R, cw, lh, fs, dpr, aspect, bottomRows, gw, gh, colorImg;
  const atlas = document.createElement("canvas"), actx = atlas.getContext("2d");
  const colorCv = document.createElement("canvas"), cctx = colorCv.getContext("2d");
  const glyphs = new Map();
  function glyph(ch) {
    let i = glyphs.get(ch);
    if (i === undefined) {
      i = glyphs.size % 96;
      glyphs.set(ch, i);
      actx.clearRect(i * gw, 0, gw, gh);
      actx.fillText(ch, i * gw, 0);
    }
    return i;
  }

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : 2);
    const W = innerWidth, H = innerHeight;
    fs = Math.max(7, Math.min(13, H / 80, W / 46));
    lh = fs * 1.18;
    ctx.font = `${fs}px ${FONT}`;
    cw = ctx.measureText("M").width;
    C = Math.floor(W / cw);
    R = Math.floor(H / lh);
    aspect = lh / cw;
    bottomRows = Math.ceil(80 / lh);
    main.width = Math.round(W * dpr); main.height = Math.round(H * dpr);
    glow.width = Math.round(W / 4); glow.height = Math.round(H / 4);
    tiny.width = Math.round(W / 12); tiny.height = Math.round(H / 12);
    // hoja de glifos: cada letra se dibuja una sola vez, en blanco
    gw = Math.ceil(cw * dpr); gh = Math.ceil(lh * dpr);
    atlas.width = gw * 96; atlas.height = gh;
    actx.font = `${fs * dpr}px ${FONT}`;
    actx.textBaseline = "top";
    actx.fillStyle = "#fff";
    glyphs.clear();
    colorCv.width = C; colorCv.height = R;
    colorImg = cctx.createImageData(C, R);
    colorImg.data.fill(255);
  }
  layout();
  addEventListener("resize", layout);

  const hudT = $("hud-t"), hudInfo = $("hud-info"), fpsEl = $("fps"), env = $("env"), letter = $("letter");
  let firma = "", T_LETTER = 9.5, t0 = 0, envShown = false;
  let quality = mobile ? 0.7 : 1.0;
  let fps = 30, lastShown = 0, busy = false, nextAt = 0, id = 0;

  function draw(f) {
    if (f.C !== C || f.R !== R) return;          // cuadro viejo de antes de un resize
    const { chars, rgb } = f;
    // 1) letras en blanco, copiadas desde la hoja de glifos
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, main.width, main.height);
    const cwD = cw * dpr, lhD = lh * dpr, px = colorImg.data;
    let k = 0;
    for (let r = 0; r < R; r++) {
      const y = Math.round(r * lhD);
      for (let c = 0; c < C; c++, k++) {
        const ch = chars[k];
        if (ch === " ") continue;
        ctx.drawImage(atlas, glyph(ch) * gw, 0, gw, gh, Math.round(c * cwD), y, gw, gh);
        const j = k * 3, p = k * 4;
        px[p] = rgb[j]; px[p + 1] = rgb[j + 1]; px[p + 2] = rgb[j + 2];
      }
    }
    // 2) color: una imagen de C x R pixeles estirada encima, en modo "multiply"
    cctx.putImageData(colorImg, 0, 0);
    ctx.globalCompositeOperation = "multiply";
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(colorCv, 0, 0, C, R, 0, 0, C * cwD, R * lhD);
    ctx.globalCompositeOperation = "source-over";
    ctx.imageSmoothingEnabled = true;    // brillo: version chiquita del cuadro, agrandada con suavizado (barato, sin filtros)
    tctx.clearRect(0, 0, tiny.width, tiny.height);
    tctx.drawImage(main, 0, 0, tiny.width, tiny.height);
    gctx.clearRect(0, 0, glow.width, glow.height);
    gctx.globalAlpha = 0.55;
    gctx.drawImage(main, 0, 0, glow.width, glow.height);
    gctx.globalAlpha = 0.75;
    gctx.drawImage(tiny, 0, 0, glow.width, glow.height);
    gctx.globalAlpha = 1;

    const t = f.t;
    hudT.innerHTML = `<b>●</b> t ${t.toFixed(2).padStart(6, " ")}s`;
    hudInfo.textContent =
      `${firma}\nbloom ${(f.bloom * 100).toFixed(1).padStart(5, " ")}%   sway ${f.sway.toFixed(2)}°\nletters ${f.letters.toLocaleString("en-US")}`;
  }

  const pending = new Map();
  function request(now) {
    if (busy || now < nextAt || document.hidden || letter.classList.contains("open")) return;
    busy = true;
    nextAt = now + 1000 / 30 - 2;               // como mucho 30 cuadros por segundo
    const t = (now - t0) / 1000;
    worker.postMessage({ type: "frame", id: ++id, t, C, R, aspect, top: 1, bottom: bottomRows, quality });
    pending.set(id, t);
  }

  function tick(now) {
    requestAnimationFrame(tick);
    request(performance.now());
    if (!envShown && t0 && (now - t0) / 1000 > T_LETTER) { envShown = true; env.classList.add("show"); }
  }

  worker.onmessage = (e) => {
    const m = e.data;
    if (m.type === "status") say("  " + m.text);
    else if (m.type === "error") $("err").textContent = "No se pudo cargar: " + m.text;
    else if (m.type === "ready") {
      say("  listo ♥");
      $("l-to").textContent = m.para.trim();
      $("l-body").textContent = m.carta.replace(/^\n+|\s+$/g, "");
      $("l-from").textContent = m.de.trim();
      firma = m.firma; T_LETTER = m.tLetter;
      const boot = $("boot");
      boot.style.opacity = 0;
      setTimeout(() => boot.remove(), 900);
      t0 = performance.now();
      requestAnimationFrame(tick);
    } else if (m.type === "frame") {
      busy = false;
      m.t = pending.get(m.id); pending.delete(m.id);
      const d0 = performance.now();
      request(d0);                               // si ya toca, Python arranca el siguiente mientras dibujamos este
      draw(m);
      const now = performance.now();
      window.__teamo = { py: Math.round(m.ms), draw: Math.round(now - d0), quality };
      if (lastShown) fps = fps * 0.85 + 0.15 * (1000 / Math.max(now - lastShown, 1));
      lastShown = now;
      fpsEl.textContent = `running · ${Math.round(Math.min(fps, 30))} fps`;
      // calidad adaptativa: si el celu no llega, bajamos la cantidad de puntos
      if (m.ms > 40 && quality > 0.5) quality = Math.max(0.5, quality - 0.1);
      else if (m.ms < 18 && quality < 1) quality = Math.min(1, quality + 0.05);
    }
  };

  // abrir / cerrar la carta (mientras esta abierta, la rosa se pausa)
  const open = () => { letter.classList.add("open"); letter.querySelector(".close").focus({ preventScroll: true }); };
  const close = () => { letter.classList.remove("open"); lastShown = 0; env.focus({ preventScroll: true }); };
  env.addEventListener("click", open);
  letter.addEventListener("click", (e) => { if (e.target === letter) close(); });
  letter.querySelector(".close").addEventListener("click", close);
  addEventListener("keydown", (e) => { if (e.key === "Escape" && letter.classList.contains("open")) close(); });
  document.addEventListener("visibilitychange", () => { lastShown = 0; });
})();
</script>
</body>
</html>
